# .github/workflows/thor-smoke.yml
name: Thor runner smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: thor
    timeout-minutes: 10
    steps:
      - name: Runner info
        run: |
          echo "arch: $(uname -m)"
          echo "host: $(hostname)"
          echo "cpus: $(nproc)"
          free -h
          head -2 /etc/os-release

      - name: Resource limits (cgroup)
        run: |
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          echo "cpu.max:    $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"

      - name: Docker socket should be absent
        run: test ! -S /var/run/docker.sock && echo "no docker socket (expected)"

      - uses: actions/checkout@v4
